
name: Test Jekyll Build

'on':
  push:
    branches:
      - botanical-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll website
        run: bundle exec jekyll build

      - name: Upload website preview
        uses: actions/upload-artifact@v4
        with:
          name: botanical-website-preview
          path: _site/

